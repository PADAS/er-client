# CI for both audiences of this repo:
#
#   1. Developers: lint-free lockfile + tests across every Python version we
#      claim to support (pyproject.toml: requires-python >= 3.8), installed
#      with `uv sync --locked` so CI fails loudly if uv.lock drifts from
#      pyproject.toml instead of silently re-resolving.
#
#   2. Consumers: people who `pip install earthranger-client` never see
#      uv.lock — they resolve fresh from the wheel's declared dependencies.
#      The install-check jobs build the distributions and install them into a
#      clean environment with no lockfile and no checkout, at both the newest
#      supported Python with the newest dependencies and the oldest supported
#      Python with our stated minimum dependency versions (lowest-direct).
#      If those bounds are wrong, these jobs fail even when the locked test
#      jobs pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-check:
    name: uv.lock matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check lockfile
        run: uv lock --check

  test:
    name: Tests (locked, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The `test` extra carries everything pytest needs; skip the dev group
      # (hatch, pre-commit) since CI doesn't use it.
      - name: Sync locked environment
        run: uv sync --locked --extra test --no-dev

      - name: Run tests
        run: uv run pytest -q

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build distributions
        run: uv build

      - name: Validate metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install-check:
    name: Installs as published (py${{ matrix.python-version }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python with the minimum versions we declare
          # (pydantic 1.10.17, httpx 0.23.3, ...): proves the lower bounds
          # in pyproject.toml are real.
          - python-version: "3.8"
            resolution: lowest-direct
          # Newest supported Python resolving to the latest releases:
          # proves nothing upstream has broken us for new installs.
          - python-version: "3.14"
            resolution: highest
    steps:
      # Deliberately no checkout: the install must succeed from the built
      # wheel alone, with dependencies resolved fresh from PyPI — no uv.lock.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install wheel with fresh resolution
        run: |
          uv venv
          uv pip install --resolution ${{ matrix.resolution }} dist/*.whl

      - name: Smoke-test import
        run: |
          .venv/bin/python -c "
          from erclient import AsyncERClient, ERClient
          from erclient.version import __version__
          print(f'earthranger-client {__version__} imports cleanly')
          "

  sdist-install-check:
    name: sdist builds and installs
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install from sdist
        run: |
          uv venv
          uv pip install dist/*.tar.gz

      - name: Smoke-test import
        run: |
          .venv/bin/python -c "
          from erclient import AsyncERClient, ERClient
          from erclient.version import __version__
          print(f'earthranger-client {__version__} imports cleanly')
          "
