# CI for both audiences of this repo:
#
#   1. Developers: lint-free lockfile + tests across every Python version we
#      claim to support (pyproject.toml: requires-python >= 3.8), installed
#      with `uv sync --locked` so CI fails loudly if uv.lock drifts from
#      pyproject.toml instead of silently re-resolving.
#
#   2. Consumers: people who `pip install earthranger-client` never see
#      uv.lock — they resolve fresh from the wheel's declared dependencies.
#      The install-check jobs build the distributions and install them into a
#      clean environment with no lockfile and no checkout, at both the newest
#      supported Python with the newest dependencies and the oldest supported
#      Python with our stated minimum dependency versions (lowest-direct).
#      If those bounds are wrong, these jobs fail even when the locked test
#      jobs pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-check:
    name: uv.lock matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check lockfile
        run: uv lock --check

  test:
    name: Tests (locked, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The `test` extra carries everything pytest needs; skip the dev group
      # (hatch, pre-commit) since CI doesn't use it.
      - name: Sync locked environment
        run: uv sync --locked --extra test --no-dev

      - name: Run tests
        run: uv run pytest -q

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build distributions
        run: uv build

      - name: Validate metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install-check:
    name: Installs as published (py${{ matrix.python-version }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python with the minimum versions we declare
          # (pydantic 1.10.17, httpx 0.25.0, ...): proves the lower bounds
          # in pyproject.toml are real.
          - python-version: "3.8"
            resolution: lowest-direct
          # Newest supported Python resolving to the latest releases:
          # proves nothing upstream has broken us for new installs.
          - python-version: "3.14"
            resolution: highest
    steps:
      # The checkout is only here to provide tests/; the package itself must
      # come from the built wheel, with dependencies resolved fresh from
      # PyPI — no uv.lock. The source package dir is deleted before pytest
      # runs so imports can only resolve to the installed wheel.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # lowest-direct trap: "direct" means the requirements named on the
      # command line. Installing dist/*.whl alone makes the wheel the only
      # direct requirement and resolves its dependencies (the ones we're
      # trying to floor-test) at HIGHEST. So: resolve the project's declared
      # dependencies as direct requirements first, then add the wheel
      # without re-resolving.
      - name: Install wheel with fresh resolution
        run: |
          uv venv
          uv pip install --resolution ${{ matrix.resolution }} -r pyproject.toml
          uv pip install --no-deps dist/*.whl

      # Runs before test tooling lands: at this point the environment holds
      # exactly what a consumer's resolver would produce.
      - name: Smoke-test import
        run: |
          .venv/bin/python -c "
          from erclient import AsyncERClient, ERClient
          from erclient.version import __version__
          print(f'earthranger-client {__version__} imports cleanly')
          "

      - name: Record consumer resolution
        run: uv pip freeze > "$RUNNER_TEMP/consumer-freeze.txt"

      # Installed as bare packages rather than the wheel's [test] extra, so
      # uv doesn't re-resolve the wheel's runtime deps — a re-resolve at the
      # default (highest) resolution would upgrade pydantic and erase the
      # lowest-direct scenario. The httpx floor in pyproject.toml is kept at
      # respx's own minimum precisely so this install has no reason to touch
      # any runtime dependency.
      - name: Install test tooling
        run: uv pip install pytest pytest-asyncio anyio respx pytest-mock

      # Don't trust the claim above — prove it. The suite is only a valid
      # consumer test if the tooling install left the wheel's resolution
      # intact.
      - name: Verify test tooling did not disturb the consumer resolution
        run: |
          uv pip freeze > "$RUNNER_TEMP/with-tooling-freeze.txt"
          for pkg in pydantic pydantic-core httpx requests dateparser gpxpy pytz; do
            before=$(grep -i "^${pkg}==" "$RUNNER_TEMP/consumer-freeze.txt" || true)
            after=$(grep -i "^${pkg}==" "$RUNNER_TEMP/with-tooling-freeze.txt" || true)
            if [ "$before" != "$after" ]; then
              echo "::error::test tooling changed ${pkg}: '${before}' -> '${after}'"
              exit 1
            fi
          done

      - name: Run test suite against the installed wheel
        run: |
          rm -rf erclient
          .venv/bin/python -m pytest tests -q

  sdist-install-check:
    name: sdist builds and installs
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install from sdist
        run: |
          uv venv
          uv pip install dist/*.tar.gz

      - name: Smoke-test import
        run: |
          .venv/bin/python -c "
          from erclient import AsyncERClient, ERClient
          from erclient.version import __version__
          print(f'earthranger-client {__version__} imports cleanly')
          "
