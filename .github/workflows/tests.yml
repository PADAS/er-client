name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-check:
    name: uv.lock matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Check lockfile
        run: uv lock --check

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # The `test` extra carries everything pytest needs; skip the dev group
      # (hatch, pre-commit) since CI doesn't use it. --locked fails loudly if
      # uv.lock drifts from pyproject.toml instead of silently re-resolving.
      - name: Install dependencies
        run: uv sync --locked --extra test --no-dev

      # --no-sync: a bare `uv run` re-syncs the environment with the default
      # dev group, undoing the --no-dev install above.
      - name: Run pytest
        run: uv run --no-sync pytest -q
