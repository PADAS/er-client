name: Tests

# `v2` is the long-lived integration branch for the 2.0 migration — a shadow
# main that gets the same CI until the big-bang merge. Both branches list both
# names so this trigger block stays identical on each and never has to be
# merged; drop `v2` at the flip.
on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-check:
    name: uv.lock matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # enable-cache: false everywhere. setup-uv caches by default from v5 on,
      # but its default key omits the matrix Python (it interpolates the
      # runner's system Python), so every job shares one key: they race to
      # save it, and the winner's wheels get restored into jobs targeting a
      # different interpreter. Nothing is lost by skipping it — a cold
      # `uv sync` here resolves in well under a second.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          version-file: uv.toml

      - name: Check lockfile
        run: uv lock --check

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          version-file: uv.toml

      # .pre-commit-config.yaml pins default_language_version, and that exact
      # interpreter has to exist here or every `language: python` hook fails to
      # build its environment. Read the pin rather than restating it: the two
      # drifting apart is a confusing failure, and main and v2 pin different
      # interpreters, so neither copy of this file should have to know which.
      - name: Read the pre-commit interpreter pin
        id: precommit-python
        run: |
          version=$(sed -n 's/^[[:space:]]*python:[[:space:]]*python\([0-9][0-9.]*\)[[:space:]]*$/\1/p' .pre-commit-config.yaml)
          if [ -z "$version" ]; then
            echo "::error::could not read default_language_version.python from .pre-commit-config.yaml"
            exit 1
          fi
          echo "Hooks run on Python $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.precommit-python.outputs.version }}

      # pre-commit comes from the locked dev group rather than a bare install,
      # so CI runs the same version the lockfile gives everyone else.
      - name: Install pre-commit
        run: uv sync --locked --only-group dev

      - name: Run hooks
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Keep in step with the Programming Language :: Python classifiers and
      # requires-python in pyproject.toml -- this list is what proves them.
      #
      # v2 narrows it to 3.11+ along with the floor, so this is the one line in
      # this file that legitimately differs between the branches, and a sync
      # merge conflicts here only if main also changes it (adding 3.15, say).
      # Resolve toward v2's floor, keeping any version main added at the top;
      # never take main's lower bound onto v2. Getting that wrong is loud, not
      # silent -- uv refuses to sync a >=3.11 project into an older venv.
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          version-file: uv.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # The `test` extra carries everything pytest needs; skip the dev group
      # (hatch, pre-commit) since CI doesn't use it. --locked fails loudly if
      # uv.lock drifts from pyproject.toml instead of silently re-resolving.
      - name: Install dependencies
        run: uv sync --locked --extra test --no-dev

      # --no-sync: a bare `uv run` re-syncs the environment with the default
      # dev group, undoing the --no-dev install above.
      - name: Run pytest
        run: uv run --no-sync pytest -q

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          version-file: uv.toml

      - name: Build distributions
        run: uv build

      - name: Validate metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Consumers who `pip install earthranger-client` never see uv.lock — they
  # resolve fresh from the wheel's declared dependencies. These jobs install
  # the built distributions into clean environments with no lockfile, at both
  # ends of the declared support range, so bad bounds in pyproject.toml fail
  # here even when the locked test jobs pass.
  install-check:
    name: Installs as published (py${{ matrix.python-version }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python with the minimum versions we declare:
          # proves the lower bounds in pyproject.toml are real.
          - python-version: "3.8"
            resolution: lowest-direct
          # Newest supported Python resolving to the latest releases:
          # proves nothing upstream has broken us for new installs.
          - python-version: "3.14"
            resolution: highest
    steps:
      # The checkout only provides pyproject.toml (see the resolution note
      # below) and tests/; the package itself comes from the built wheel,
      # and the source package dir is deleted right after the wheel install
      # so imports can only resolve to the installed wheel.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          version-file: uv.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # lowest-direct trap: "direct" means the requirements named on the
      # command line. Installing dist/*.whl alone makes the wheel the only
      # direct requirement and resolves its dependencies (the ones we're
      # trying to floor-test) at HIGHEST. So: resolve the project's declared
      # dependencies as direct requirements first, then add the wheel
      # without re-resolving.
      - name: Install wheel with fresh resolution
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --resolution ${{ matrix.resolution }} -r pyproject.toml
          uv pip install --no-deps dist/*.whl

      # `python -c` puts the working directory first on sys.path, so with the
      # checkout present every import below would resolve to the source tree
      # instead of the installed wheel. Delete the source package so the
      # smoke test and the suite can only import what the wheel shipped.
      - name: Remove source package
        run: rm -rf erclient

      # Runs before test tooling lands: at this point the environment holds
      # exactly what a consumer's resolver would produce.
      - name: Smoke-test import
        run: |
          .venv/bin/python -c "
          from erclient import AsyncERClient, ERClient
          from erclient.version import __version__
          print(f'earthranger-client {__version__} imports cleanly')
          "

      - name: Record consumer resolution
        run: uv pip freeze > "$RUNNER_TEMP/consumer-freeze.txt"

      # Installed as bare packages rather than the wheel's [test] extra, so
      # uv doesn't re-resolve the wheel's runtime deps — a re-resolve at the
      # default (highest) resolution would upgrade pydantic and erase the
      # lowest-direct scenario. The recorded consumer resolution is passed as
      # a constraint so the tooling resolves *around* the runtime deps
      # instead of upgrading them: in the floor job respx backs off to
      # 0.21.x, the newest release compatible with httpx 0.23.3. The grep
      # drops the local-wheel line (constraints must be version pins).
      - name: Install test tooling
        run: |
          grep -v ' @ ' "$RUNNER_TEMP/consumer-freeze.txt" > "$RUNNER_TEMP/constraints.txt"
          uv pip install --constraint "$RUNNER_TEMP/constraints.txt" pytest pytest-asyncio anyio respx pytest-mock

      # Don't trust the constraint mechanism — prove it held. The suite is
      # only a valid consumer test if the tooling install left the wheel's
      # resolution intact: every pre-tooling freeze entry, transitives
      # included, must survive unchanged. Additions are fine — they are the
      # test tools themselves.
      - name: Verify test tooling did not disturb the consumer resolution
        run: |
          uv pip freeze > "$RUNNER_TEMP/with-tooling-freeze.txt"
          changed=$(comm -23 <(sort "$RUNNER_TEMP/consumer-freeze.txt") <(sort "$RUNNER_TEMP/with-tooling-freeze.txt"))
          if [ -n "$changed" ]; then
            echo "::error::test tooling changed or removed consumer packages:"
            echo "$changed"
            exit 1
          fi

      - name: Run test suite against the installed wheel
        run: .venv/bin/python -m pytest tests -q

  sdist-install-check:
    name: sdist ships the right files, installs, and tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Deliberately not a full checkout: `.venv/bin/python -c` puts the
      # working directory first on sys.path, so a source `erclient/` here
      # would shadow the sdist install the smoke test is meant to exercise.
      # uv.toml alone is fetched, only so setup-uv can read the version pin.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: uv.toml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # tool.hatch.build.targets.sdist in pyproject.toml keeps repo
      # scaffolding out of the tarball. Assert the result rather than trusting
      # the config: anything new at the top level is either a deliberate
      # addition to that include list — in which case add it here too — or
      # something that leaked back in. pyproject.toml, .gitignore, PKG-INFO,
      # the readme and license-files are force-included by hatchling and
      # cannot be dropped, so they are expected members.
      - name: Check the sdist ships nothing unexpected
        run: |
          expected=$(printf '%s\n' \
            .gitignore LICENSE PKG-INFO README.md pyproject.toml erclient tests \
            | sort)
          # Strip the version prefix directory, keep first path segments only.
          actual=$(tar -tzf dist/*.tar.gz | sed 's|^[^/]*/||' | cut -d/ -f1 | grep . | sort -u)
          unexpected=$(comm -13 <(echo "$expected") <(echo "$actual"))
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected top-level entries in the sdist:"
            echo "$unexpected"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          version-file: uv.toml

      - name: Install from sdist
        run: |
          uv venv
          uv pip install dist/*.tar.gz

      - name: Smoke-test import
        run: |
          .venv/bin/python -c "
          from erclient import AsyncERClient, ERClient
          from erclient.version import __version__
          print(f'earthranger-client {__version__} imports cleanly')
          "

      # The include list is an allowlist, so its failure mode is shipping too
      # little. install-check already runs the suite against the built
      # distribution, but from the *checkout's* tests/ — so a tests/ missing
      # from the sdist would pass there unnoticed. Unpack what we published
      # and run the suite out of it, the way a distro repackager would.
      #
      # Note this deliberately exercises the sdist's own erclient/: cwd leads
      # sys.path, so imports resolve to the unpacked source, not the install
      # above. That is the property under test — the tarball standing alone as
      # a complete source release.
      - name: Unpack the sdist
        run: |
          mkdir -p "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1

      # Taken from the sdist's own [test] extra rather than a hand-written
      # tool list, so a broken extra declaration fails here too. Unlike
      # install-check this wants a plain resolution — proving the declared
      # dependency floors hold is that job's business, not this one's.
      - name: Install test tooling from the sdist's [test] extra
        run: |
          sdist=$(ls dist/*.tar.gz)  # build publishes exactly one
          uv pip install "${sdist}[test]"

      - name: Run the suite from the unpacked sdist
        working-directory: ${{ runner.temp }}/sdist
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest tests -q
