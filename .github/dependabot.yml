version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'America/Los_Angeles'

updates:
  - package-ecosystem: 'github-actions'
    # '/' is what picks up .github/workflows -- there is no separate glob for it.
    directory: '/'
    multi-ecosystem-group: 'all-dependencies'
    patterns: ['*']
